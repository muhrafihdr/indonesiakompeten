<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 500" role="img"
     aria-label="Ilustrasi proses sertifikasi kompetensi">
  <defs>
    <linearGradient id="bgArt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EAF2FF"/>
      <stop offset="1" stop-color="#DCE9FB"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B2A4A"/>
      <stop offset="1" stop-color="#1565D8"/>
    </linearGradient>
    <linearGradient id="sealGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2A93B"/>
      <stop offset="1" stop-color="#E63946"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0B2A4A" flood-opacity=".16"/>
    </filter>
    <filter id="soft2" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0B2A4A" flood-opacity=".18"/>
    </filter>
  </defs>

  <!-- Latar -->
  <rect width="620" height="500" rx="26" fill="url(#bgArt)"/>
  <circle cx="530" cy="86" r="70" fill="#2E7BF6" opacity=".10"/>
  <circle cx="86" cy="420" r="88" fill="#F2A93B" opacity=".14"/>
  <circle cx="558" cy="404" r="46" fill="#E63946" opacity=".12"/>

  <!-- Grid halus -->
  <g stroke="#0B2A4A" stroke-opacity=".07" stroke-width="1">
    <path d="M0 130h620M0 250h620M0 370h620M155 0v500M310 0v500M465 0v500"/>
  </g>

  <!-- Kartu sertifikat utama -->
  <g filter="url(#soft)">
    <rect x="168" y="72" width="300" height="356" rx="20" fill="#ffffff"/>
  </g>
  <rect x="168" y="72" width="300" height="76" rx="20" fill="url(#cardGrad)"/>
  <rect x="168" y="126" width="300" height="22" fill="url(#cardGrad)"/>

  <!-- Header kartu -->
  <circle cx="204" cy="110" r="15" fill="#ffffff" opacity=".22"/>
  <path d="m197.5 110 5 5 10.5-10" fill="none" stroke="#ffffff" stroke-width="3.2"
        stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="230" y="98" width="120" height="9" rx="4.5" fill="#ffffff" opacity=".85"/>
  <rect x="230" y="114" width="76" height="7" rx="3.5" fill="#ffffff" opacity=".5"/>

  <!-- Baris data -->
  <g>
    <rect x="196" y="176" width="244" height="24" rx="8" fill="#F2F7FF"/>
    <rect x="208" y="184" width="90" height="8" rx="4" fill="#7FA6D9"/>
    <rect x="360" y="184" width="68" height="8" rx="4" fill="#C3D6EE"/>

    <rect x="196" y="210" width="244" height="24" rx="8" fill="#F2F7FF"/>
    <rect x="208" y="218" width="112" height="8" rx="4" fill="#7FA6D9"/>
    <rect x="360" y="218" width="68" height="8" rx="4" fill="#C3D6EE"/>

    <rect x="196" y="244" width="244" height="24" rx="8" fill="#F2F7FF"/>
    <rect x="208" y="252" width="74" height="8" rx="4" fill="#7FA6D9"/>
    <rect x="360" y="252" width="68" height="8" rx="4" fill="#C3D6EE"/>
  </g>

  <!-- Daftar unit kompeten -->
  <g>
    <circle cx="208" cy="302" r="10" fill="#E8F7F1"/>
    <path d="m203.5 302 3.2 3.2 6-6" fill="none" stroke="#12855F" stroke-width="2.6"
          stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="226" y="297" width="140" height="9" rx="4.5" fill="#C9D8EA"/>

    <circle cx="208" cy="334" r="10" fill="#E8F7F1"/>
    <path d="m203.5 334 3.2 3.2 6-6" fill="none" stroke="#12855F" stroke-width="2.6"
          stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="226" y="329" width="106" height="9" rx="4.5" fill="#C9D8EA"/>

    <circle cx="208" cy="366" r="10" fill="#E8F7F1"/>
    <path d="m203.5 366 3.2 3.2 6-6" fill="none" stroke="#12855F" stroke-width="2.6"
          stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="226" y="361" width="126" height="9" rx="4.5" fill="#C9D8EA"/>
  </g>

  <!-- Tanda tangan -->
  <path d="M200 404c14-12 20 8 32-4 9-9 14 6 26-2" fill="none" stroke="#0B2A4A"
        stroke-width="3" stroke-linecap="round" opacity=".5"/>
  <rect x="196" y="392" width="118" height="1.5" fill="#DCE6F2"/>
  <rect x="196" y="414" width="72" height="7" rx="3.5" fill="#DCE6F2"/>

  <!-- Segel / badge -->
  <g filter="url(#soft2)">
    <circle cx="452" cy="372" r="56" fill="url(#sealGrad)"/>
  </g>
  <circle cx="452" cy="372" r="45" fill="none" stroke="#ffffff" stroke-width="2.5"
          stroke-dasharray="7 7" opacity=".85"/>
  <path d="m431 372 14 14 30-30" fill="none" stroke="#ffffff" stroke-width="7.5"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M414 416l-14 34 26-11 16 20 8-34z" fill="#E63946" opacity=".92"/>

  <!-- Kartu kecil: asesor -->
  <g filter="url(#soft2)">
    <rect x="56" y="120" width="176" height="86" rx="16" fill="#ffffff"/>
  </g>
  <circle cx="88" cy="150" r="15" fill="#EAF2FF"/>
  <path d="M88 143a5.4 5.4 0 1 1 0 10.8 5.4 5.4 0 0 1 0-10.8Zm-9.5 18a9.6 9.6 0 0 1 19 0Z"
        fill="#1565D8"/>
  <rect x="114" y="136" width="88" height="9" rx="4.5" fill="#0B2A4A" opacity=".8"/>
  <rect x="114" y="152" width="58" height="7" rx="3.5" fill="#C9D8EA"/>
  <rect x="76" y="180" width="140" height="9" rx="4.5" fill="#EAF2FF"/>

  <!-- Kartu kecil: TUK -->
  <g filter="url(#soft2)">
    <rect x="404" y="176" width="162" height="78" rx="16" fill="#ffffff"/>
  </g>
  <rect x="424" y="196" width="30" height="30" rx="9" fill="#FEF4E2"/>
  <path d="M439 205l8.5 3.6v6.4c0 4.7-3.4 8.1-8.5 9.4-5.1-1.3-8.5-4.7-8.5-9.4v-6.4Z"
        fill="#F2A93B"/>
  <rect x="466" y="198" width="78" height="9" rx="4.5" fill="#0B2A4A" opacity=".8"/>
  <rect x="466" y="214" width="52" height="7" rx="3.5" fill="#C9D8EA"/>
  <rect x="424" y="234" width="120" height="7" rx="3.5" fill="#EAF2FF"/>

  <!-- Bintang kecil -->
  <path d="m566 132 4.8 9.9 10.9 1.6-7.9 7.7 1.9 10.9-9.7-5.1-9.7 5.1 1.9-10.9-7.9-7.7 10.9-1.6Z"
        fill="#F2A93B" opacity=".85"/>
</svg>
